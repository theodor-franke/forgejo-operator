apiVersion: forgejo.schranke.de/v1alpha1
kind: ForgejoActionSecret
metadata:
  labels:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/managed-by: kustomize
  name: forgejoactionsecret-sample
  namespace: default
spec:
  organizationRef:
    name: forgejoorganization-sample
  name: DOCKER_PASSWORD
  valueFrom:
    secretName: docker-registry-credentials
    secretNamespace: default
    key: password

# not used by the forgejo-operator itself. You can comment the following lines
# if you do not want those helpers be installed with your Project.
- forgejowebhook_admin_role.yaml
- forgejowebhook_editor_role.yaml
- forgejowebhook_viewer_role.yaml
- forgejorepository_admin_role.yaml
- forgejorepository_editor_role.yaml
- forgejorepository_viewer_role.yaml
- forgejoactionsecret_admin_role.yaml
- forgejoactionsecret_editor_role.yaml
- forgejoactionsecret_viewer_role.yaml
- forgejoorganization_admin_role.yaml
- forgejoorganization_editor_role.yaml
- forgejoorganization_viewer_role.yaml
- forgejo_admin_role.yaml
- forgejo_editor_role.yaml
- forgejo_viewer_role.yaml


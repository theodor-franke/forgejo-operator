---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-forgejo-schranke-de-v1alpha1-forgejoorganization
  failurePolicy: Fail
  name: vforgejoorganization-v1alpha1.kb.io
  rules:
  - apiGroups:
    - forgejo.schranke.de
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - forgejoorganizations
  sideEffects: None

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.18.0
  name: forgejoactionsecrets.forgejo.schranke.de
spec:
  group: forgejo.schranke.de
  names:
    kind: ForgejoActionSecret
    listKind: ForgejoActionSecretList
    plural: forgejoactionsecrets
    singular: forgejoactionsecret
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ForgejoActionSecret is the Schema for the forgejoactionsecrets
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ForgejoActionSecretSpec defines the desired state of ForgejoActionSecret.
            properties:
              name:
                description: |-
                  Name is the action secret's name on Forgejo, e.g. DOCKER_PASSWORD. It
                  must start with a letter or underscore and contain only letters,
                  digits, and underscores; Forgejo uppercases it regardless of the case
                  used here.
                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                type: string
              organizationRef:
                description: |-
                  OrganizationRef references the ForgejoOrganization this action secret
                  belongs to.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              valueFrom:
                description: |-
                  ValueFrom sources the action secret's value from a key in a
                  Kubernetes Secret.
                properties:
                  key:
                    type: string
                  secretName:
                    type: string
                  secretNamespace:
                    type: string
                required:
                - key
                - secretName
                - secretNamespace
                type: object
            required:
            - name
            - organizationRef
            - valueFrom
            type: object
          status:
            description: ForgejoActionSecretStatus defines the observed state of ForgejoActionSecret.
            properties:
              message:
                description: |-
                  Message contains additional detail when Status is not "Ready", such as
                  the last error encountered while talking to the Forgejo instance.
                type: string
              status:
                description: |-
                  Status is a short, human-readable summary of the reconciliation state,
                  e.g. "Ready" or "Error".
                type: string
            type: object

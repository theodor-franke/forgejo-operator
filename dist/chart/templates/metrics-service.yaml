apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgejo-operator.fullname" . }}-controller-manager-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  ports:
  - name: https
    port: {{ .Values.metrics.port }}
    protocol: TCP
    targetPort: {{ .Values.metrics.port }}
  selector:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager

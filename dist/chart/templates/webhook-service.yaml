apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgejo-operator.fullname" . }}-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo-operator.labels" . | nindent 4 }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: {{ .Values.webhook.port }}
  selector:
    app.kubernetes.io/name: forgejo-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager

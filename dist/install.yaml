apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: forgejoorganizations.forgejo.schranke.de
spec:
  group: forgejo.schranke.de
  names:
    kind: ForgejoOrganization
    listKind: ForgejoOrganizationList
    plural: forgejoorganizations
    singular: forgejoorganization
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ForgejoOrganization is the Schema for the forgejoorganizations
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ForgejoOrganizationSpec defines the desired state of ForgejoOrganization.
            properties:
              adminPermissionRights:
                description: |-
                  AdminPermissionRights allows repository administrators to add/remove team
                  members and change team access without being an organization owner.
                type: boolean
              instanceRef:
                description: |-
                  InstanceRef references the Forgejo instance this organization should be
                  created on, by the name of a cluster-scoped Forgejo resource.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              teams:
                description: |-
                  Teams are created (and kept in sync) on the organization. Each team's
                  Groups are also aggregated, across every ForgejoOrganization pointing at
                  the same instance, into the claimed-group-to-organization-team mapping
                  configured on that instance's first OAuth2/OIDC authentication source.
                items:
                  properties:
                    accessMode:
                      default: custom
                      description: |-
                        AccessMode selects between Forgejo's two team permission modes:
                        "custom" (the default), where RepoPermissions grants access
                        per repository feature, or "admin", where members get full
                        administrator access to every feature of every team repository
                        (including deleting repositories and managing collaborators) and
                        RepoPermissions is ignored.
                      enum:
                      - custom
                      - admin
                      type: string
                    canCreateOrgRepo:
                      description: |-
                        CanCreateOrgRepo allows members of this team to create new repositories
                        in the organization.
                      type: boolean
                    description:
                      description: Description is shown on the team's page in Forgejo.
                      type: string
                    groups:
                      description: |-
                        Groups are the names of IdP-claimed groups that should be mapped to this
                        team via the instance's authentication source (see ForgejoOrganizationSpec.Teams).
                      items:
                        type: string
                      type: array
                    includesAllRepositories:
                      description: |-
                        IncludesAllRepositories gives the team access to all current and future
                        repositories in the organization, rather than only explicitly assigned ones.
                      type: boolean
                    name:
                      description: Name is both the team's name in Kubernetes and
                        its name on Forgejo.
                      type: string
                    repoPermissions:
                      description: |-
                        RepoPermissions sets the team's per-feature repository access when
                        AccessMode is "custom" (the default). Every field defaults to "none".
                      properties:
                        actions:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                        code:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                        issues:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                        packages:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                        projects:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                        pullRequests:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                        releases:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                        wiki:
                          default: none
                          enum:
                          - none
                          - read
                          - write
                          type: string
                      type: object
                  required:
                  - name
                  type: object
                type: array
              visibility:
                default: public
                description: Visibility controls who can see the organization.
                enum:
                - public
                - limited
                - private
                type: string
            required:
            - instanceRef
            type: object
          status:
            description: ForgejoOrganizationStatus defines the observed state of ForgejoOrganization.
            properties:
              message:
                description: |-
                  Message contains additional detail when Status is not "Ready", such as the
                  last error encountered while talking to the Forgejo instance.
                type: string
              status:
                description: |-
                  Status is a short, human-readable summary of the reconciliation state,
                  e.g. "Ready" or "Error".
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
